# gtg.dyn TMB trial: reference test against the Python prototype and fits to the
# simulated rebuild datasets. Runs on pushes to dev-gtgdyn that touch ci/gtgdyn,
# publishes results to the branch ci-out/gtgdyn-trial.
name: gtgdyn-trial

on:
  push:
    branches: ['dev-gtgdyn']
    paths: ['ci/gtgdyn/**', '.github/workflows/gtgdyn-trial.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtgdyn-trial
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-gtgdyn-${{ runner.os }}-v1
      - name: Install TMB
        run: Rscript -e 'if (!requireNamespace("TMB", quietly = TRUE)) install.packages(c("TMB","RcppEigen"))'
      - name: Run trial (results pushed to ci-out/gtgdyn-trial every 3 min)
        run: |
          mkdir -p out pub
          publish() {
            rm -rf pub/* && cp out/*.log out/*.csv out/*.md out/*.txt pub/ 2>/dev/null
            echo "$1" > pub/state.txt
            ( cd pub && rm -rf .git && git init -q && git checkout -q -b ci-out/gtgdyn-trial &&
              git config user.name flicc-ci && git config user.email flicc-ci@users.noreply.github.com &&
              git add -A && git commit -qm "gtgdyn trial @ ${GITHUB_SHA::7} ($1)" &&
              git push -qf "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git" ci-out/gtgdyn-trial )
          }
          ( Rscript ci/gtgdyn/run_trial.R ci/gtgdyn out > out/console.log 2>&1; echo "status=$?" > out/status.txt ) &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 180; publish running; done
          publish finished
