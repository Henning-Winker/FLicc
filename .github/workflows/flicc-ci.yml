# FLicc CI: build, tests, regression against main, Rmd rendering.
# Runs on every push to a branch named dev-* or ci-* (and manually from the
# Actions tab). Results are published to the branch ci-out/<branch>
# (summary.md, logs, rendered html), so they can be read with plain git.
name: flicc-ci

on:
  push:
    branches: ['dev-**', 'ci-**']
  workflow_dispatch:
    inputs:
      render:
        description: 'Render the full user guide'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flicc-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
      # full user guide only with [render] in the commit message or a manual run with render = true;
      # otherwise only the changed guide chapters are rendered (inst/guide/preview.Rmd)
      RENDER_GUIDE: ${{ contains(github.event.head_commit.message, '[render]') || github.event.inputs.render == 'true' }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: new
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ hashFiles('new/DESCRIPTION') }}-v1
          restore-keys: rlib-${{ runner.os }}-

      - name: Install dependencies
        run: |
          Rscript -e 'pk <- c("remotes","TMB","RcppEigen","statmod","doFuture","progressr","scales","ggplot2","rmarkdown","knitr","foreach","future");
                      miss <- pk[!pk %in% rownames(installed.packages())]; if (length(miss)) install.packages(miss)'
          Rscript -e 'for (p in c("FLCore","ggplotFL")) if (!requireNamespace(p, quietly = TRUE)) remotes::install_github(paste0("flr/", p), upgrade = "never")'

      - name: Build main and branch
        run: |
          mkdir -p lib_base lib_new out
          rm -f base/src/*.o base/src/*.so base/src/*.dll new/src/*.o new/src/*.so new/src/*.dll
          status=0
          R CMD INSTALL --library=lib_new new > out/build.log 2>&1 || status=1
          echo "build=$status" >> out/status.txt
          R CMD INSTALL --library=lib_base base > out/build_main.log 2>&1 || echo "build_main=1" >> out/status.txt

      - name: Tests
        if: always()
        run: Rscript new/ci/run_tests.R new lib_new out || true

      - name: Regression against main
        if: always()
        run: Rscript new/ci/compare_main.R new lib_base lib_new out || true

      - name: Render changed Rmd files
        if: always()
        run: |
          cd new
          changed=$(git diff --name-only origin/main...HEAD -- '*.Rmd' | grep -v '^ci/' || true)
          cd ..
          render() {   # render <rmd> [params expression]
            f=$1; p=${2:-NULL}; name=$(basename $f .Rmd)
            if R_LIBS="$PWD/lib_new:$R_LIBS_USER" Rscript -e "rmarkdown::render('new/$f', output_dir = 'out/html', params = $p)" > "out/render_$name.log" 2>&1; then
              echo "render:$f=0" >> out/status.txt
            else
              echo "render:$f=1" >> out/status.txt
            fi
          }
          # other Rmd files (vignettes etc.) as before
          for f in $(echo "$changed" | grep -v '^inst/guide/' || true); do
            [ -f "new/$f" ] && render "$f"
          done
          guide_changed=$(echo "$changed" | grep '^inst/guide/' || true)
          if [ "$RENDER_GUIDE" = "true" ]; then
            render inst/guide/FLicc_user_guide.Rmd
          elif [ -n "$guide_changed" ]; then
            # preview the chapters changed by this push (all chapters changed since main for a new branch)
            cd new
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              pushed=$(git diff --name-only "$BEFORE" HEAD -- 'inst/guide/chapters/*.Rmd' || true)
            else
              pushed=$(echo "$guide_changed" | grep '^inst/guide/chapters/' || true)
            fi
            cd ..
            chapters=$(echo "$pushed" | grep '^inst/guide/chapters/' | xargs -r -n1 basename | sed 's/\.Rmd$//' | paste -sd, -)
            if [ -n "$chapters" ]; then
              render inst/guide/preview.Rmd "list(chapters = '$chapters')"
            fi
          fi

      - name: Summary
        if: always()
        run: Rscript new/ci/summary.R out "$BRANCH" "$GITHUB_SHA"

      - name: Publish results to ci-out/<branch>
        if: always()
        run: |
          cd out
          git init -q && git checkout -q -b "ci-out/$BRANCH"
          git config user.name flicc-ci && git config user.email flicc-ci@users.noreply.github.com
          git add -A && git commit -qm "CI results for $BRANCH @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git" "ci-out/$BRANCH"

      - name: Fail if anything failed
        if: always()
        run: "! grep -q '=1$' out/status.txt"
